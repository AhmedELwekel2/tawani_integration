# In-container nginx: serve the SPA. TLS and the /tawani proxy live on the host.
# nginx ships no mime type for .mjs, so an ES-module asset is served as
# application/octet-stream and the browser refuses to execute it. That silently
# breaks the pdf.js worker (pdf.worker.min-*.mjs), which the report viewer needs:
# the document appears to load, then fails to render.
types {
    application/javascript  mjs;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
