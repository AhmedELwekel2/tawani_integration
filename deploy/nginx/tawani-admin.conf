# Admin panel.  Replace admin.jtgcsa.thetransformix.com with the real hostname.
#
# This vhost is the ONLY place the agent's mutating routes are reachable, which
# is what actually protects them: VITE_TAWANI_ADMIN_KEY would be readable in the
# public JS bundle, so the key alone is not a control. Restrict this vhost by IP
# or basic auth if the panel is not meant to be internet-facing.

server {
    listen 80;
    listen [::]:80;
    server_name admin.jtgcsa.thetransformix.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.jtgcsa.thetransformix.com;

    ssl_certificate     /etc/letsencrypt/live/admin.jtgcsa.thetransformix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jtgcsa.thetransformix.com/privkey.pem;
    include snippets/ssl.conf;

    access_log /var/log/nginx/tawani-admin.access.log;
    error_log  /var/log/nginx/tawani-admin.error.log;

    # Optional hardening -- uncomment to limit the panel to known networks:
    # allow 197.0.0.0/8;
    # deny all;

    # ---- Tawani agent, full access ----------------------------------------
    location /tawani/ {
        proxy_pass http://127.0.0.1:8012;
        rewrite ^/tawani/(.*)$ /$1 break;
        proxy_http_version 1.1;
        include snippets/proxy.conf;
        # A full report run takes 1-6 minutes; anything shorter cuts it off.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        include snippets/proxy.conf;
    }

    client_max_body_size 50M;
}
