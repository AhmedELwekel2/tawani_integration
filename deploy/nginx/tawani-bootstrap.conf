# Bootstrap vhost — install this FIRST, before the real ones.
#
# Chicken and egg: the real vhosts reference certificate files, and nginx refuses
# to load (so `nginx -t` fails and nothing reloads) if those files do not exist
# yet. This HTTP-only vhost answers the ACME challenge so certbot can issue them.
#
#   1. cp this to sites-available, symlink it, nginx -t && systemctl reload nginx
#   2. certbot certonly --webroot -w /var/www/certbot \
#        -d jtgcsa.thetransformix.com -d admin.jtgcsa.thetransformix.com
#   3. remove this symlink, install tawani-portal.conf + tawani-admin.conf,
#      nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name jtgcsa.thetransformix.com admin.jtgcsa.thetransformix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Tawani: certificate provisioning in progress\n";
        add_header Content-Type text/plain;
    }
}
