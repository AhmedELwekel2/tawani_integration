# Stockholder portal.  Replace investors.example.com with the real hostname.
#
# Mirrors the convention already used on this VPS (see ibdl.conf): host nginx
# terminates TLS with a certbot certificate and proxies to a container bound on
# 127.0.0.1.  Container ports: portal 3060, admin 3061, agent 8012.

server {
    listen 80;
    listen [::]:80;
    server_name investors.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name investors.example.com;

    ssl_certificate     /etc/letsencrypt/live/investors.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investors.example.com/privkey.pem;
    include snippets/ssl.conf;

    access_log /var/log/nginx/tawani-portal.access.log;
    error_log  /var/log/nginx/tawani-portal.error.log;

    # ---- Tawani agent, read-only ------------------------------------------
    # Stockholders may browse news and read published reports. Everything that
    # generates or mutates is refused here, so even a tampered bundle cannot
    # start a paid LLM run from the portal's origin.
    location ~ ^/tawani/(news|library)(/|$) {
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:8012;
        rewrite ^/tawani/(.*)$ /$1 break;
        proxy_http_version 1.1;
        include snippets/proxy.conf;
        # A cold news fetch scrapes ~50 sources.
        proxy_read_timeout 300s;
    }

    location /tawani/ { return 403; }

    # ---- SPA ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        include snippets/proxy.conf;
    }

    client_max_body_size 10M;
}
